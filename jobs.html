      "Outstanding customer service orientation; able to handle on-call including weekends",
      "Some hardware setup and troubleshooting skills preferred"
    ]
  }
];

// ── RENDER ──
const jobsList = document.getElementById('jobsList');
const jobDetail = document.getElementById('jobDetail');
const pageIntro = document.getElementById('pageIntro');
const filterBar = document.getElementById('filterBar');
const backNav = document.getElementById('backNav');

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(job) {
  const isFilled = job.status === 'filled';
  const filledClass = isFilled ? ' filled' : '';
  const filledBadge = isFilled ? `<div class="filled-badge">✦ Position Filled</div>` : '';
  const compTag = job.comp ? `<span class="tag">${escH(job.comp.split(' ')[0] + (job.comp.includes('–') ? ' ' + job.comp.split('–')[0].trim().replace(/^[^$]*/,'') + '–...' : ''))}</span>` : '';
  // Show short comp range tag
  const compShort = job.comp ? (() => {
    const m = job.comp.match(/\$[\d,]+\s*–\s*\$[\d,]+/);
    return m ? `<span class="tag">${escH(m[0])}</span>` : '';
  })() : '';
  const tags = job.tags.map(t => `<span class="tag${t === job.tags[0] ? ' accent' : ''}">${escH(t)}</span>`).join('');
  const filledTag = isFilled ? `<span class="tag filled-tag">Filled</span>` : `<span class="tag">Confidential Search</span>`;

  return `<div class="job-card${filledClass}" data-id="${escH(job.id)}" data-category="${escH(job.category)}" onclick="showDetail('${escH(job.id)}')">
    ${filledBadge}
    <div class="job-header">
      <div>
        <div class="job-meta">${tags}${filledTag}${compShort}</div>
        <div class="job-title">${escH(job.title)}</div>
        <div class="job-location">${escH(job.location)}</div>
      </div>
      <div class="card-arrow">›</div>
    </div>
  </div>`;
}

function renderDetail(job) {
  const isFilled = job.status === 'filled';
  const filledNotice = isFilled ? `
    <div class="filled-notice">
      <strong>This position has been filled${job.filledDate ? ' (' + escH(job.filledDate) + ')' : ''}.</strong>
      We keep filled roles posted for reference. If you have similar experience, we may have comparable opportunities open now.
      <br><button class="cta-link" onclick="showList()">See all open roles →</button>
    </div>` : '';
  const tags = job.tags.map(t => `<span class="tag${t === job.tags[0] ? ' accent' : ''}">${escH(t)}</span>`).join('');
  const ownsHtml = job.owns.map(o => `<li>${escH(o)}</li>`).join('');
  const reqHtml = job.requirements.map(r => `<li>${escH(r)}</li>`).join('');
  const compSection = job.comp ? `<div class="detail-section"><h3>Compensation</h3><span class="comp-range">${escH(job.comp)}</span></div>` : '';
  const applyClass = isFilled ? ' filled-apply' : '';
  const formId = `form-${job.id}`;
  const pageUrl = `${location.origin}${location.pathname}#${job.id}`;

  const applyBlock = isFilled
    ? `<div class="apply-block filled-apply">
        <p>This position has been filled. For similar roles, reach out directly: <strong>info@twbls.com</strong></p>
      </div>`
    : `<div class="apply-block">
        <h3>Apply for This Role</h3>
        <form class="apply-form" id="${escH(formId)}" onsubmit="submitApp(event,'${escH(job.id)}','${escH(job.title)}')"
          enctype="multipart/form-data">
          <div class="form-row">
            <div class="form-field">
              <label for="${escH(formId)}-name">Full Name</label>
              <input id="${escH(formId)}-name" name="name" type="text" placeholder="Jane Smith" required>
            </div>
            <div class="form-field">
              <label for="${escH(formId)}-email">Email</label>
              <input id="${escH(formId)}-email" name="email" type="email" placeholder="jane@email.com" required>
            </div>
          </div>
          <div class="form-field">
            <label for="${escH(formId)}-phone">Phone (optional)</label>
            <input id="${escH(formId)}-phone" name="phone" type="tel" placeholder="(555) 000-0000">
          </div>
          <div class="form-field">
            <label>Resume</label>
            <label class="file-label" id="${escH(formId)}-filelabel">
              <span>📎 Choose PDF or Word file</span>
              <input type="file" name="resume" accept=".pdf,.doc,.docx" required
                onchange="updateFileName(this,'${escH(formId)}-filelabel')">
            </label>
          </div>
          <div class="form-msg" id="${escH(formId)}-msg"></div>
          <button class="submit-btn" type="submit">Submit Application</button>
          <p class="confidential-note">Confidential search — firm name disclosed to qualified candidates.</p>
        </form>
      </div>`;

  return `<div class="detail-header">
    <div class="detail-meta">${tags}</div>
    <div class="detail-title">${escH(job.title)}</div>
    <div class="detail-location">${escH(job.location)}</div>
  </div>
  <div class="detail-body${isFilled ? ' filled-content' : ''}">
    ${filledNotice}
    <div class="editorial">"${escH(job.editorial)}"</div>
    <div class="detail-section"><h3>The Role</h3><p>${escH(job.summary)}</p></div>
    <div class="detail-section"><h3>What You'll Own</h3><ul>${ownsHtml}</ul></div>
    <div class="detail-section"><h3>What We're Looking For</h3><ul>${reqHtml}</ul></div>
    ${compSection}
    ${applyBlock}
    <div class="permalink-strip">
      <span>Shareable link:</span>
      <button class="copy-link-btn" onclick="copyLink('${escH(pageUrl)}', this)">Copy link</button>
    </div>
  </div>`;
}

function showList() {
  const hash = '';
  history.pushState(null, '', location.pathname);
  pageIntro.classList.remove('hidden');
  filterBar.classList.remove('hidden');
  jobsList.classList.remove('hidden');
  jobDetail.classList.remove('visible');
  backNav.classList.remove('visible');
  jobDetail.style.display = 'none';
  document.title = 'Open Roles — TWB Legal Search';
}

function showDetail(id) {
  const job = JOBS.find(j => j.id === id);
  if (!job) return showList();
  history.pushState(null, '', `${location.pathname}#${id}`);
  pageIntro.classList.add('hidden');
  filterBar.classList.add('hidden');
  jobsList.classList.add('hidden');
  jobDetail.classList.add('visible');
  jobDetail.style.display = 'block';
  backNav.classList.add('visible');
  jobDetail.innerHTML = renderDetail(job);
  document.title = `${job.title} — TWB Legal Search`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyLink(url, btn) {
  try {
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy link', 2000);
    }).catch(() => fallbackCopy(url, btn));
  } catch(e) { fallbackCopy(url, btn); }
}
function fallbackCopy(url, btn) {
  const ta = document.createElement('textarea');
  ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); btn.textContent = 'Copied!'; } catch(e) {}
  document.body.removeChild(ta);
  setTimeout(() => btn.textContent = 'Copy link', 2000);
}

// ── FILTERS ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    const f = this.dataset.filter;
    document.querySelectorAll('.job-card').forEach(card => {
      card.style.display = (f === 'all' || card.dataset.category === f) ? '' : 'none';
    });
  });
});

// ── INIT ──
jobsList.innerHTML = JOBS.map(renderCard).join('');

function routeHash() {
  const hash = location.hash.replace('#', '');
  if (hash && JOBS.find(j => j.id === hash)) {
    showDetail(hash);
  } else {
    showList();
  }
}

window.addEventListener('hashchange', routeHash);
window.addEventListener('popstate', routeHash);
routeHash();

function updateFileName(input, labelId) {
  const label = document.getElementById(labelId);
  if (!label) return;
  if (input.files && input.files[0]) {
    label.innerHTML = `<span class="file-name">✓ ${escH(input.files[0].name)}</span><input type="file" name="resume" accept=".pdf,.doc,.docx" required onchange="updateFileName(this,'${labelId}')"/>`;
  }
}

async function submitApp(e, jobId, jobTitle) {
  e.preventDefault();
  const form = e.target;
  const msgEl = form.querySelector('[id$="-msg"]');
  const btn = form.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  msgEl.className = 'form-msg';
  msgEl.textContent = '';

  const fd = new FormData(form);
  fd.set('position', jobTitle);

  try {
    const res = await fetch('/api/apply', { method: 'POST', body: fd });
    let data;
    try { data = await res.json(); } catch { data = {}; }
    if (res.ok && data.success) {
      msgEl.className = 'form-msg success';
      msgEl.textContent = 'Application received. We\'ll be in touch.';
      form.reset();
      // reset file label
      const fileLabel = form.querySelector('.file-label');
      if (fileLabel) fileLabel.innerHTML = '<span>📎 Choose PDF or Word file</span><input type="file" name="resume" accept=".pdf,.doc,.docx" required onchange="updateFileName(this,this.closest(\'label\').id)">';
    } else {
      throw new Error(data.error || 'Submission failed. Please try again or email info@twbls.com.');
    }
  } catch(err) {
    msgEl.className = 'form-msg error';
    msgEl.textContent = err.message || 'Something went wrong. Please email info@twbls.com.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Application';
  }
}
</script>
